<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PZ Mod Manager</title>
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#111315; --panel:#181b1e; --panel2:#1f2327; --panel3:#262b30; --border:#2d3338; --border2:#3a4148;
  --text:#e7e9eb; --muted:#9aa3ab; --dim:#6c757d;
  --accent:#c9473c; --accent2:#e05a4e; --ok:#4fb477; --warn:#e3a63b; --err:#e5534b; --info:#5b9bd5;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--info);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3237;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:minmax(0,1fr);height:100%}

/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo{width:40px;height:40px;flex:none;filter:drop-shadow(0 3px 8px #0008)}
.brand b{display:block;font-size:15px}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--panel3);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--err);color:#fff;border-radius:10px;padding:1px 7px;font-weight:700}
.nav .count.warn{background:var(--warn);color:#1a1a1a}
.side .grow{flex:1}
.gamebox{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:12px;font-size:12.5px;color:var(--muted)}
.gamebox .row{display:flex;justify-content:space-between;margin-bottom:4px}
.gamebox .row b{color:var(--text);font-weight:600}
.play{margin-top:10px;width:100%}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--border);background:var(--bg)}
.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.2px}
.top .sp{flex:1}
.profile{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
select,input[type=text]{background:var(--panel2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;outline:none}
select:focus,input[type=text]:focus{border-color:var(--accent)}
select{min-width:230px;cursor:pointer}
.langsw{display:flex;background:var(--panel2);border:1px solid var(--border2);border-radius:20px;padding:2px;gap:2px}
.langsw button{all:unset;cursor:pointer;padding:3px 10px;border-radius:16px;font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.3px}
.langsw button:hover{color:var(--text)}
.langsw button.on{background:var(--accent);color:#fff}
.langsw button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.savechip{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
.savechip.ok{color:var(--ok)}
.content{flex:1;min-height:0;overflow:auto;padding:22px 26px 90px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border2);background:var(--panel3);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:#2f353b;border-color:#4a525a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ok{background:#22412f;border-color:#2f5d41;color:#bff0d0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--text)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.lg{padding:11px 20px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:15px;height:15px}

/* cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
.card h2{font-size:15px;margin:0 0 4px;font-weight:650}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.hero{position:relative;overflow:hidden;padding:24px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(110deg,#1b1e21 30%,#25191780),var(--panel)}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;filter:saturate(.8);mask-image:linear-gradient(90deg,transparent 25%,#000 85%)}
.hero > *{position:relative}
.hero h2{font-size:21px;margin:0 0 4px;letter-spacing:-.3px}
.hero p{color:var(--muted);margin:0 0 18px;max-width:640px}
.steps{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;max-width:720px}
.step{display:flex;align-items:center;gap:12px;background:#15181bcc;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.step .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;background:var(--panel3);color:var(--muted);border:1px solid var(--border2)}
.step.done .ic{background:var(--ok);border-color:var(--ok);color:#0b1a10}
.step.cur .ic{background:var(--accent);border-color:var(--accent);color:#fff}
.step .tx{flex:1}
.step .tx b{display:block;font-weight:600}
.step .tx span{font-size:12px;color:var(--muted)}
.step.done .tx b{color:#b7dcc4}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv span{color:var(--muted)}
.kv code{font-family:Consolas,monospace;font-size:12px;color:#cfd6dc;word-break:break-all}
.checks{display:flex;flex-direction:column;gap:7px;margin:4px 0 14px}
.chk{display:flex;align-items:center;gap:9px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px #4fb47722}
.dot.err{background:var(--err);box-shadow:0 0 0 3px #e5534b22}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px #e3a63b22}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-top:12px}
.note b{color:var(--text)}
.statline{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:12px 14px}
.stat b{font-size:22px;display:block;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--muted)}
.stat.err b{color:var(--err)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--panel3);color:var(--muted);border:1px solid var(--border2);white-space:nowrap}
.badge.err{background:#3a1a19;color:#ff9b94;border-color:#5a2724}
.badge.warn{background:#3a2d14;color:#f3c877;border-color:#5a4520}
.badge.ok{background:#173323;color:#8fdcae;border-color:#24503a}
.badge.info{background:#172a3d;color:#9cc6ef;border-color:#22415f}
.badge.java{background:#2e1f3d;color:#d1aef5;border-color:#45305c}

/* toolbar + list */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=text]{width:280px}
.chips{display:flex;gap:6px}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:20px;font-size:12.5px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-weight:550}
.chip:hover{color:var(--text)}
.chip.on{background:var(--panel3);border-color:var(--border2);color:var(--text)}
.chip .n{opacity:.6;margin-left:3px}
.issues{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.issues .hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.issues .hd b{flex:1}
.issue{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;border-bottom:1px solid #22272b}
.issue:last-child{border-bottom:0}
.issue .who{color:var(--muted);font-size:12px;min-width:0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue .tx{flex:1}
.list{display:flex;flex-direction:column;gap:6px}
.mod{background:var(--panel);border:1px solid var(--border);border-radius:11px;transition:border-color .12s}
.mod:hover{border-color:var(--border2)}
.mod.active{background:linear-gradient(90deg,#1d2125,#181b1e 60%)}
.mod .line{display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer}
.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--panel3);flex:none;border:1px solid var(--border)}
.thumb.ph{display:grid;place-items:center;color:var(--dim);font-weight:700;font-size:13px}
.mod .nm{flex:1;min-width:0}
.mod .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod .nm span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mod .bdg{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:360px}
.ord{font-size:11px;color:var(--dim);width:26px;text-align:right;font-variant-numeric:tabular-nums}
.det{padding:4px 16px 16px 82px;font-size:13px;color:#c9cfd4;display:grid;gap:10px}
.det .desc{color:var(--muted);white-space:pre-wrap;max-height:120px;overflow:auto;font-size:12.5px}
.det .k{color:var(--muted);font-size:12px;margin-right:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:12px;font-size:12px;margin:2px 4px 2px 0;background:var(--panel3);border:1px solid var(--border2)}
.pill.ok{border-color:#2f5d41;color:#a5dfbc}
.pill.err{border-color:#6a2c28;color:#ffaaa3}
.pill.off{color:var(--muted)}

/* toggle */
.tog{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.tog input{display:none}
.tog i{position:absolute;inset:0;border-radius:20px;background:#343a40;transition:.15s;border:1px solid #444c54}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#aeb6bd;transition:.15s}
.tog input:checked + i{background:var(--accent);border-color:var(--accent)}
.tog input:checked + i::after{left:20px;background:#fff}

/* rec cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rc{background:var(--panel);border:1px solid var(--border);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .12s,transform .12s}
.rc:hover{border-color:var(--border2);transform:translateY(-1px)}
.rc .img{height:128px;background:#0d0f10 center/cover no-repeat;position:relative}
.rc .img .tl{position:absolute;left:8px;top:8px;display:flex;gap:5px}
.rc .bd{padding:12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.rc .bd b{font-weight:620;line-height:1.3}
.rc .bd .meta{font-size:11.5px;color:var(--muted)}
.rc .bd .nt{font-size:12.5px;color:#c3c9ce}
.rc .ft{padding:0 13px 13px;display:flex;gap:6px;align-items:center}
.rc .ft .sp{flex:1}
.sec{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
.sec h3{margin:0;font-size:16px;font-weight:650}
.sec span{color:var(--muted);font-size:12.5px}
.sec .sp{flex:1}

/* queue + toast + modal */
.queue{position:fixed;right:22px;bottom:22px;width:360px;background:var(--panel2);border:1px solid var(--border2);border-radius:14px;padding:14px 16px;box-shadow:0 14px 40px #000a;z-index:20}
.queue > b{display:block;margin-bottom:2px}
.queue .bar{height:5px;background:var(--panel3);border-radius:5px;margin:10px 0;overflow:hidden}
.queue .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.queue p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:30;align-items:center;pointer-events:none}
.toast{background:#262b30;border:1px solid var(--border2);padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px #0008;font-size:13px;max-width:560px;animation:tin .18s ease-out;pointer-events:auto}
.toast.ok{border-left:4px solid var(--ok)} .toast.err{border-left:4px solid var(--err)} .toast.warn{border-left:4px solid var(--warn)} .toast.info{border-left:4px solid var(--info)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modalbg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:40;backdrop-filter:blur(2px)}
.modal{width:min(520px,92vw);background:var(--panel2);border:1px solid var(--border2);border-radius:14px;padding:20px 22px;box-shadow:0 20px 60px #000c}
.modal h3{margin:0 0 8px;font-size:16px}
.modal .mb{color:#cdd3d8;font-size:13.5px;white-space:pre-wrap}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.spin{width:14px;height:14px;border:2px solid #ffffff33;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
/* mapa de conflitos */
.mxwrap{overflow:auto;max-height:62vh;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
.mx{display:grid;gap:2px;padding:0 10px 10px 0;width:max-content}
.mx > div{height:22px}
.mx .lb{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px 0 10px;color:var(--muted);position:sticky;left:0;background:var(--panel);z-index:1;line-height:22px}
.mx .lb.on{color:var(--text)}
.mx .hd{font-size:10px;color:var(--dim);text-align:center;position:sticky;top:0;background:var(--panel);z-index:1;line-height:22px;padding-top:6px;height:28px}
.mx .corner{position:sticky;left:0;top:0;z-index:2;background:var(--panel);height:28px}
.mx .c{width:22px;border-radius:4px;background:var(--panel2);font-size:9.5px;display:grid;place-items:center;color:#1a1a1a;font-weight:700}
.mx .c.d{background:var(--panel3)}
.mx .c.hit{background:var(--warn);cursor:pointer}
.mx .c.bad{background:var(--err);color:#fff;cursor:pointer}
.mx .c.sel{outline:2px solid #fff;outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.cfc{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:12px}
.cfc.err{border-left-color:var(--err)} .cfc.warn{border-left-color:var(--warn)} .cfc.info{border-left-color:var(--info)} .cfc.ok{border-left-color:var(--ok)}
.cfc .ch{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.cfc .ch b{flex:1;min-width:0;font-weight:620}
.cfc .ch b span{color:var(--muted);font-weight:400;margin:0 6px}
.cfc .cb{padding:0 14px 12px;display:grid;gap:8px;font-size:13px}
.cfc ul{margin:0;padding-left:18px;color:#c9cfd4}
.cfc li{margin:2px 0}
.cfc .win{font-size:12.5px;color:var(--muted)}
.cfc .win b{color:var(--text)}
.cfsum{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--panel);margin-bottom:14px}
.cfsum b{font-size:15px}
.cfsum.ok{border-color:#2f5d41;background:#16241c}
.pts{font-family:Consolas,monospace;font-size:12px;color:#cfd6dc;max-height:220px;overflow:auto;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px;column-width:260px}
/* memória */
.memtop{display:flex;align-items:center;gap:10px;margin-top:4px}
.memtop b{font-size:26px;letter-spacing:-.5px}
.memtop .cur{margin-left:auto;font-size:12px;color:var(--muted)}
input[type=range].mem{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:var(--track);outline:none;margin:16px 0 2px;cursor:pointer}
input[type=range].mem::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #3a4148;box-shadow:0 2px 8px #000b}
input[type=range].mem:focus-visible::-webkit-slider-thumb{border-color:var(--accent)}
input[type=range].mem:disabled{opacity:.5;cursor:not-allowed}
.memscale{position:relative;height:30px;font-size:11px;color:var(--dim);margin:0 11px}
.memscale span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.memscale span.rec{color:#8fdcae;font-weight:650;top:14px}
.memscale span.rec::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:10px;background:#8fdcae;border-radius:1px}
.memdesc{font-size:13px;color:#c9cfd4;min-height:38px}
.srv{display:flex;align-items:center;gap:14px;padding:14px 16px}
.srv .ic{width:40px;height:40px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;flex:none}
.srv .ic svg{width:20px;height:20px;color:var(--muted)}
.srv .nm{flex:1}
.srv .nm b{display:block}
.srv .nm span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="40" height="40">
  <defs>
    <radialGradient id="skin" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#8fbf6a"/><stop offset=".6" stop-color="#6f9d50"/><stop offset="1" stop-color="#4e7638"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6dde3"/><stop offset=".5" stop-color="#9eabb6"/><stop offset="1" stop-color="#6b7884"/>
    </linearGradient>
    <radialGradient id="led" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ff8a7a"/><stop offset=".7" stop-color="#e5372b"/><stop offset="1" stop-color="#7a0f0a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4a3a" stop-opacity=".55"/><stop offset="1" stop-color="#ff4a3a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="head"><circle cx="128" cy="134" r="110"/></clipPath>
    <!-- costura em zigue-zague: tudo à direita dela é robô -->
    <clipPath id="robot"><path d="M134 0 L124 40 L138 78 L122 118 L138 158 L122 198 L136 256 L256 256 L256 0 Z"/></clipPath>
  </defs>

  <!-- antena do lado robô -->
  <line x1="190" y1="40" x2="208" y2="10" stroke="#24313a" stroke-width="10" stroke-linecap="round"/>
  <line x1="190" y1="40" x2="208" y2="10" stroke="#8e9ba6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="209" cy="10" r="9" fill="url(#led)" stroke="#24313a" stroke-width="4"/>

  <!-- cabeça -->
  <circle cx="128" cy="134" r="110" fill="url(#skin)"/>
  <g clip-path="url(#head)">
    <!-- cérebro exposto (lado zumbi) -->
    <path d="M30 70 Q40 30 92 26 L104 40 L90 52 L100 66 L78 72 L62 66 L46 80 Z" fill="#c98f86" stroke="#5a3a33" stroke-width="5" stroke-linejoin="round"/>
    <path d="M52 62 q8 -10 16 -2 q8 -10 16 -2 M60 46 q8 -8 18 -2 M70 60 q4 6 12 4" fill="none" stroke="#8a5a52" stroke-width="3.5" stroke-linecap="round"/>

let seq = 0; const waiting = new Map();
function call(cmd, args = {}, timeoutMs = 90000) {
  return new Promise((res, rej) => {
    const id = ++seq;
    const timer = setTimeout(() => {
      if (!waiting.has(id)) return;
      waiting.delete(id);
      rej(new Error(`A operação "${cmd}" demorou demais. Talvez o antivírus esteja verificando arquivos do jogo; tente de novo em instantes.`));
    }, timeoutMs);
    waiting.set(id, {res: v => { clearTimeout(timer); res(v); }, rej: e => { clearTimeout(timer); rej(e); }});
    window.chrome.webview.postMessage(JSON.stringify({id, cmd, args}));
  });
}
window.chrome.webview.addEventListener("message", e => {
  const m = JSON.parse(e.data);
  if (m.event) { onEvent(m.event, m.data); return; }
  const w = waiting.get(m.id); if (!w) return; waiting.delete(m.id);
  m.ok ? w.res(m.data) : w.rej(new Error(m.error || "erro"));
});

      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (i < 0 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
    };
    document.addEventListener("keydown", key, true);
    box.querySelectorAll("[data-m]").forEach(b => b.onclick = () => close(b.dataset.m === "1"));
    box.querySelector('[data-m="1"]').focus();
  });
}

function buildIndex() {
  I.modsById = new Map(); I.modByKey = new Map(); I.items = new Map();
  for (const it of S.items) I.items.set(it.id, it);
  // mods do Workshop primeiro, locais depois (o primeiro de cada ID é o "principal")
  const sorted = [...S.mods].sort((a, b) => (a.source === "local") - (b.source === "local"));
  for (const m of sorted) {
    I.modByKey.set(m.key, m);
    if (!I.modsById.has(m.id)) I.modsById.set(m.id, []);
    I.modsById.get(m.id).push(m);
  }
}
const primary = id => I.modsById.get(id)?.[0] || null;
const itemOf = m => m?.workshopId ? I.items.get(m.workshopId) : null;
const modName = id => primary(id)?.name || id;
const itemTitle = id => I.items.get(id)?.title || S?.titles?.[id] || REC?.items?.find(x => x.id === id)?.title || ("Item " + id);
function itemMods(wid) { const it = I.items.get(wid); return it ? it.modKeys.map(k => I.modByKey.get(k)).filter(Boolean) : []; }
function mainMod(ms) { return ms.length <= 1 ? ms[0] : [...ms].sort((a, b) => a.id.length - b.id.length)[0]; }

/** dependências de um mod: require= do mod.info + "Required items" da página do Workshop */
function depsOf(id) {
  const m = primary(id);
  if (!m) return {ids: [], missingItems: []};
  const ids = new Set(m.requires);
  const missingItems = [];
  for (const r of itemOf(m)?.requiredItems || []) {
    if (!I.items.has(r.id)) { missingItems.push(r); continue; }
    const ms = itemMods(r.id);
    if (!ms.length || ms.some(x => ids.has(x.id))) continue;
    ids.add(mainMod(ms).id);
  }
  ids.delete(id);
  return {ids: [...ids], missingItems};
}
function needsZB(m) {
  if (!m) return false;
  if (m.id.toLowerCase() === "zombiebuddy") return true;
  if (m.requires.some(r => r.toLowerCase() === "zombiebuddy")) return true;
  return (itemOf(m)?.requiredItems || []).some(r => r.id === ZB_ID);
}

/** ordem de carregamento: dependências antes, respeitando loadModAfter/Before, mantendo a ordem atual quando possível */
function computeOrder(list) {
  const ids = [...new Set(list)];
  const pos = new Map(ids.map((x, i) => [x, i])), inSet = new Set(ids);
  const out = new Map(ids.map(x => [x, new Set()])), indeg = new Map(ids.map(x => [x, 0]));
  const edge = (a, b) => { if (a === b || !inSet.has(a) || !inSet.has(b) || out.get(a).has(b)) return; out.get(a).add(b); indeg.set(b, indeg.get(b) + 1); };
  for (const id of ids) {
    const m = primary(id); if (!m) continue;
    for (const r of depsOf(id).ids) edge(r, id);
    for (const a of m.loadAfter) edge(a, id);
    for (const b of m.loadBefore) edge(id, b);
  }
  const res = [], ready = ids.filter(x => indeg.get(x) === 0);
  while (ready.length) {
    ready.sort((a, b) => pos.get(a) - pos.get(b));
    const x = ready.shift(); res.push(x);
    for (const y of out.get(x)) { indeg.set(y, indeg.get(y) - 1); if (indeg.get(y) === 0) ready.push(y); }
  }
  for (const x of ids) if (!res.includes(x)) res.push(x); // ciclo: mantém como está
  return res;
}

}

/* ---------- conflitos (pontos que 2+ mods ativos alteram) ---------- */
let CF = null, cfLoading = false, cfTab = "att", cfMap = false, cfOpen = new Set(), cfFocus = null;
const cfIgnored = new Set(store.get("cfIgnored", []));
const cfStable = p => [p.a, p.b].sort().join("|");
const cfKey = () => P.key + "|" + P.active.join(",");
async function loadConflicts() {
  const k = cfKey();
  if (cfLoading || CF?.k === k) return;
  cfLoading = true;
  try { CF = {k, list: await call("getConflicts", {keys: P.active.map(id => primary(id)?.key).filter(Boolean)}, 180000)}; }
  catch (e) { CF = {k, list: []}; toast("Não foi possível varrer os conflitos: " + esc(e.message), "warn"); }
  finally { cfLoading = false; render(); }
}
/** Map "a|b" -> {a, b, points:[{kind, name}]}; b é o que carrega depois (vence). */
function conflictPairs() {
  const act = new Set(P.active), pairs = new Map();
  const push = (x, y, pt) => {
    const [a, b] = P.active.indexOf(x) < P.active.indexOf(y) ? [x, y] : [y, x], k = a + "|" + b;
    if (!pairs.has(k)) pairs.set(k, {a, b, points: []});
    pairs.get(k).points.push(pt);
  };
  for (const o of S.overlaps.concat(CF?.list || [])) {
    const ms = [...new Set(o.mods.map(k => I.modByKey.get(k)).filter(m => m && act.has(m.id) && primary(m.id) === m).map(m => m.id))];
    for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) push(ms[i], ms[j], {kind: o.kind || "file", name: o.file});
  }
  for (const id of P.active) for (const x of primary(id)?.incompatible || [])
    if (act.has(x) && x !== id) push(id, x, {kind: "incompat", name: `${modName(id)} declara incompatibilidade com ${modName(x)}`});
  return pairs;
}

/** problemas do perfil atual */
function analyze() {
  const issues = [], per = new Map();
  const act = new Set(P.active);
  const add = (id, sev, text, fix, tag) => { const it = {id, sev, text, fix, tag}; issues.push(it); if (id) { if (!per.has(id)) per.set(id, []); per.get(id).push(it); } };
  const game = S.env.gameVersion || "42.0";
  const zbNeeded = [];
  for (const id of P.active) {
    const m = primary(id);
    if (!m) { add(id, "warn", `"${id}" está na lista, mas não está instalado.`, {type: "remove", id, label: "Remover da lista"}); continue; }
    const d = depsOf(id);
    for (const r of d.ids) {
      if (act.has(r)) continue;
      if (I.modsById.has(r)) add(id, "err", `Precisa de "${modName(r)}", que está desativado.`, {type: "activate", id: r, label: "Ativar"});
      else {
        const cand = (itemOf(m)?.requiredItems || []).filter(x => !I.items.has(x.id)).map(x => x.id);
        add(id, "err", `Precisa do mod "${r}", que não está instalado.`,
            cand.length ? {type: "subscribe", ids: cand, label: "Inscrever"} : {type: "search", q: r, label: "Procurar no Workshop"});
      }
    }
    for (const mi of d.missingItems)
      if (!issues.some(x => x.fix?.type === "subscribe" && x.id === id && x.fix.ids.includes(mi.id)))
        add(id, "err", `Precisa do item "${mi.title}" do Workshop (não inscrito).`, {type: "subscribe", ids: [mi.id], label: "Inscrever"});
    for (const x of m.incompatible)
      if (act.has(x)) add(id, "err", `Incompatível com "${modName(x)}".`, {type: "deactivate", id: x, label: "Desativar " + modName(x)});
    if (!m.b42Ok) add(id, "warn", "Não tem pasta para o Build 42: provavelmente é só para o B41 e o jogo vai ignorá-lo.", null, "obs");
    if (m.versionMin && cmpGame(game, m.versionMin) < 0) add(id, "err", `Exige o jogo na versão ${m.versionMin} ou mais nova (você tem ${game}).`);
    if (m.versionMax && cmpGame(game, m.versionMax) > 0) add(id, "warn", `Feito para até a versão ${m.versionMax} (você tem ${game}): obsoleto para esta versão.`, null, "obs");
    const it = itemOf(m);
    if (it?.removed) add(id, "warn", "Não está mais disponível no Workshop (removido ou oculto).", null, "obs");
    if (OBS_NAME.test(`${m.name} ${it?.title || ""}`) || OBS_DESC.test(`${m.description} ${it?.shortDesc || ""}`))
      add(id, "warn", "Marcado pelo autor como obsoleto/descontinuado (no nome ou na descrição). Veja a página: talvez outro mod o substitua.", null, "obs");
    else if (m.versionMax && cmpGame(game, m.versionMax) === 0)
      add(id, "info", `Feito para até a versão ${m.versionMax}: deve parar de funcionar na próxima atualização do jogo.`, null, "soon");
    else if (it?.remoteTimeUpdated && nowSec() - it.remoteTimeUpdated > 365 * 86400)
      add(id, "info", `Sem atualização há mais de 1 ano (${ago(it.remoteTimeUpdated)}): pode estar abandonado e quebrar numa atualização do jogo.`, null, "soon");
    if (it?.outdated) add(id, "info", "Há atualização no Workshop. A Steam baixa sozinha; se demorar, abra os downloads da Steam.", {type: "downloads", label: "Downloads da Steam"});
    if (needsZB(m) && S.zb.state !== "ok") zbNeeded.push(id);
    if ((I.modsById.get(id) || []).length > 1) add(id, "info", `Este ID existe em ${I.modsById.get(id).length} lugares (Workshop/local). O jogo usa só um.`);
  }
  if (zbNeeded.length) {
    const zbFix = S.zb.state === "not_subscribed" ? {type: "subscribe", ids: [ZB_ID], label: "Inscrever"}
      : {type: "zbInstall", label: S.zb.state === "needs_repair" ? "Reparar ZombieBuddy" : "Instalar ZombieBuddy"};
    const it = {id: null, sev: "err", text: `${zbNeeded.length === 1 ? `"${modName(zbNeeded[0])}" precisa` : `${zbNeeded.length} mods precisam`} do ZombieBuddy instalado no jogo. ${S.zb.message}`, fix: zbFix};
    issues.unshift(it);
    for (const id of zbNeeded) { if (!per.has(id)) per.set(id, []); per.get(id).push({...it, id}); }
  }
  // pontos alterados por mais de um mod ativo (arquivos; scripts e mapas quando a aba Conflitos já varreu)
  let nPairs = 0;
  for (const p of conflictPairs().values()) {
    const pts = p.points.filter(x => x.kind !== "incompat");
    if (!pts.length) continue;
    nPairs++;
    add(p.a, "info", `Pode conflitar com "${modName(p.b)}": os dois alteram ${pts.length} ponto(s) (ex.: ${pts[0].name.split("/").pop()}). Vale o de "${modName(p.b)}", que carrega por último.`);
  }
  if (nPairs) add(null, "info", `${nPairs} par(es) de mods ativos alteram os mesmos pontos (o último a carregar vence).`, {type: "map", label: "Ver mapa de conflitos"});
  // memória do Java: o padrão (3 GB) estoura com mapas grandes e muitos mods (OutOfMemoryError ao carregar o mundo)
  const mem = S.memory;
  if (mem?.xmxMb && mem.xmxMb < memNeed().mb * 0.75 && recMem() > mem.xmxMb)
    issues.unshift({id: null, sev: "err", text: `O jogo só pode usar ${mem.xmxMb / 1024} GB de memória. Com ${P.active.length} mods (mapas/Java), ele costuma fechar ou travar ao carregar o mundo (OutOfMemoryError).`,
      fix: {type: "memory", mb: recMem(), label: `Usar ${gb(recMem())}`}});
  const sorted = computeOrder(P.active);
  if (sorted.join("|") !== P.active.join("|")) add(null, "info", "A ordem de carregamento pode ser ajustada para respeitar dependências.", {type: "sort", label: "Ajustar ordem"});
  return {issues, per,
    err: issues.filter(i => i.sev === "err").length,
    warn: issues.filter(i => i.sev === "warn").length};
}

let saveTimer = null, dirty = false;
function scheduleSave() {
  dirty = true;
  clearTimeout(saveTimer);
  $("#savechip").className = "savechip"; $("#savechip").textContent = "Salvando…";
  saveTimer = setTimeout(saveProfile, 350);
}
async function saveProfile() {
  P.active = computeOrder(P.active);
  const args = {key: P.key, active: P.active};
  if (P.type === "server") {
    const ws = new Set();
    for (const id of P.active) { const m = primary(id); if (m?.workshopId) ws.add(m.workshopId); }
    for (const w of P.workshopItems) if (!I.items.has(w)) ws.add(w); // mantém itens que não temos localmente
    args.workshopItems = P.workshopItems = [...ws];
    // mapas de mods: entram antes do mapa base
    const managed = new Set(S.mods.flatMap(m => m.mapNames));
    const wanted = [...new Set(P.active.flatMap(id => primary(id)?.mapNames || []))];
    let maps = P.maps.filter(x => !managed.has(x) || wanted.includes(x));
    for (const w of [...wanted].reverse()) if (!maps.includes(w)) maps.unshift(w);
    if (!maps.length) maps = ["Muldraugh, KY"];
    if (maps.join(";") !== P.maps.join(";")) args.maps = P.maps = maps;
  }
  try {
    await call("saveProfile", args);
    dirty = false;
    P.exists = true;
    $("#savechip").className = "savechip ok"; $("#savechip").textContent = "✓ Salvo";
    setTimeout(() => { if ($("#savechip").textContent === "✓ Salvo") $("#savechip").textContent = ""; }, 2500);
    if (S.env.gameRunning) toast("O jogo está aberto: as mudanças valem quando você reiniciar o jogo (ou recarregar o save).", "warn", 6000);
  } catch (e) {
    $("#savechip").textContent = "";
    toast("Erro ao salvar: " + esc(e.message), "err", 7000);
  }
  render();
}

/* ---------- ativar / desativar ---------- */
async function setActive(id, on, quiet = false) {
  const act = new Set(P.active);
  if (on) {
    const added = [], missing = [];
    const visit = x => {
      if (act.has(x)) return;
      if (!I.modsById.has(x)) { missing.push(x); return; }
      act.add(x); added.push(x);
      for (const r of depsOf(x).ids) visit(r);
    };
    visit(id);
    const conflicts = [...act].filter(a => !added.includes(a) && added.some(n =>
      (primary(n)?.incompatible || []).includes(a) || (primary(a)?.incompatible || []).includes(n)));
    if (conflicts.length) {
      const ok = await modal("Mods incompatíveis",
        `"${esc(modName(id))}" é incompatível com:\n• ${conflicts.map(c => esc(modName(c))).join("\n• ")}\n\nDesativar esses e continuar?`, "Desativar e continuar");
      if (!ok) return false;
      conflicts.forEach(c => act.delete(c));
    }
    P.active = P.active.filter(x => act.has(x)).concat(added.filter(x => !P.active.includes(x)));
    if (!quiet) {
      const extra = added.filter(x => x !== id);
      if (extra.length) toast(`Ativado <b>${esc(modName(id))}</b> + dependências: ${extra.map(x => esc(modName(x))).join(", ")}`, "ok");
      if (missing.length) toast(`Faltam mods necessários: ${missing.map(esc).join(", ")}. Veja a aba Mods.`, "warn", 6000);
    }
  } else {
    // quem depende deste (direta ou indiretamente)
    const dependents = new Set();
    let grew = true;
    while (grew) {
      grew = false;
      for (const a of act) {
        if (a === id || dependents.has(a)) continue;
        if (depsOf(a).ids.some(d => d === id || dependents.has(d))) { dependents.add(a); grew = true; }
      }
    }
    if (dependents.size) {
      const ok = await modal("Outros mods precisam deste",
        `Estes mods precisam de "${esc(modName(id))}":\n• ${[...dependents].map(d => esc(modName(d))).join("\n• ")}\n\nDesativar todos?`, "Desativar todos");
      if (!ok) return false;
      dependents.forEach(d => act.delete(d));
    }
    act.delete(id);
    P.active = P.active.filter(x => act.has(x));
  }
  scheduleSave(); render();
  return true;
}

async function activateItem(wid) {

}

}

/* ---------- inscrição (fila) ---------- */
function openWorkshop(id) { call("open", {url: "steam://url/CommunityFilePage/" + id}); }
// ST = status lido dos logs da Steam (inscrições registradas e fila de downloads)
let ST = null, pendingSince = store.get("pendingSince", 0), stBusy = false;
const nowSec = () => Math.floor(Date.now() / 1000);
const isSubscribed = id => I.items.has(id) || !!ST?.subscribed?.includes(id);
const waitingIds = () => [...pendingActivate].filter(id => !I.items.has(id));

function startQueue(ids, autoActivate = true) {
  ids = [...new Set(ids)].filter(id => !I.items.has(id));
  if (!ids.length) { toast("Você já está inscrito em tudo isso.", "ok"); return; }
  if (!waitingIds().length || !pendingSince) { pendingSince = nowSec() - 30; store.set("pendingSince", pendingSince); }
  if (autoActivate) ids.forEach(i => pendingActivate.add(i));
  store.set("pending", [...pendingActivate]);
  Q = {ids, i: 0}; store.set("queue", Q);
  openWorkshop(ids[0]);
  render(); pollSteam();
}
function queueNext() {
  if (!Q) return;
  Q.i++;
  while (Q.i < Q.ids.length && isSubscribed(Q.ids[Q.i])) Q.i++;
  if (Q.i >= Q.ids.length) { finishQueue(); return; }
  store.set("queue", Q); openWorkshop(Q.ids[Q.i]); render();
}
function finishQueue() {
  Q = null; store.set("queue", null);
  render();
}
function stopWaiting() {
  for (const id of waitingIds()) pendingActivate.delete(id);
  store.set("pending", [...pendingActivate]);
  render();
}

/** Lê os logs da Steam enquanto houver inscrição em andamento ou download esperado. */
async function pollSteam() {
  if (stBusy || (!Q && !waitingIds().length)) return;
  stBusy = true;
  try {
    ST = await call("steamStatus", {since: pendingSince || nowSec() - 3600}, 20000);
    // a Steam registrou a inscrição do item atual: abre o próximo sozinho
    if (Q && isSubscribed(Q.ids[Q.i])) {
      toast(`✓ Inscrito em <b>${esc(itemTitle(Q.ids[Q.i]))}</b>.`, "ok", 3000);
      queueNext();
    } else render();
  } catch { /* silencioso: tenta de novo no próximo ciclo */ }
  finally { stBusy = false; }
}
setInterval(pollSteam, 3000);

/** Texto do estado do download de um item (ou da fila em geral). */
function steamWaitText(id) {
  if (id && !isSubscribed(id)) return {short: "Aguardando inscrição", long: "A Steam ainda não registrou a inscrição. Na página que abriu, clique em <b>Inscrever-se</b>."};
  const st = ST?.pzState;
  if (st === "downloading") return {short: "Baixando…", long: "A Steam está baixando agora."};
  if (st === "suspended") return {short: "Download pausado", long: "O download está <b>pausado</b> na Steam. Abra os Downloads e retome."};
  if (st === "queued" && ST?.busyAppName) return {short: "Na fila da Steam",
    long: `A Steam baixa um item por vez e está ocupada com <b>${esc(ST.busyAppName)}</b>. Em Downloads, clique na seta <b>⬆</b> do Project Zomboid para baixar primeiro.`};
  if (st === "queued") return {short: "Na fila da Steam", long: "Está na fila de downloads da Steam."};
  return {short: "Esperando a Steam", long: "Inscrição registrada. A Steam deve começar o download em instantes (às vezes só ao abrir o jogo)."};
}

function renderQueue() {
  const box = $("#queueBox");
  if (Q) {
    const id = Q.ids[Q.i], done = Q.ids.filter(isSubscribed).length;
    box.innerHTML = `<div class="queue">
      <b>Inscrição ${Q.i + 1} de ${Q.ids.length}: ${esc(itemTitle(id))}</b>
      <div class="bar"><i style="width:${Math.round(done / Q.ids.length * 100)}%"></i></div>
      <p>Na página que abriu na Steam, clique em <b>Inscrever-se</b>. Assim que a Steam registrar, eu sigo sozinho.</p>
      <div class="row"><button class="btn sm" data-a="qopen">Abrir de novo</button>
      <button class="btn ghost sm" data-a="qnext">Pular</button><span style="flex:1"></span>
      <button class="btn ghost sm" data-a="qcancel">Cancelar</button></div></div>`;
    return;
  }
  const wait = waitingIds();
  if (!wait.length) { box.innerHTML = ""; return; }
  const w = steamWaitText(wait.find(x => !isSubscribed(x)) || null);
  box.innerHTML = `<div class="queue">
    <b>${wait.length === 1 ? `Aguardando a Steam baixar "${esc(itemTitle(wait[0]))}"` : `Aguardando a Steam baixar ${wait.length} mods`}</b>
    <p style="margin:6px 0 8px">${w.long}</p>
    ${wait.length > 1 ? `<p style="font-size:12px">${wait.map(x => esc(itemTitle(x))).join(" · ")}</p>` : ""}
    <p style="font-size:12px">Quando chegar, ativo sozinho em <b>${esc(profLabel())}</b>.</p>
    <div class="row"><button class="btn primary sm" data-a="downloads">Downloads da Steam</button><span style="flex:1"></span>
    <button class="btn ghost sm" data-a="stopWait">Parar de esperar</button></div></div>`;
}

/* ---------- depois de cada mudança no disco ---------- */
async function afterChange() {
  // ativa automaticamente o que acabou de ser baixado
  for (const wid of [...pendingActivate]) {
    if (!I.items.has(wid)) continue;
    pendingActivate.delete(wid);
    const ms = itemMods(wid);
    if (ms.length === 1 && !P.active.includes(ms[0].id)) {
      await setActive(ms[0].id, true, true);
      toast(`✓ <b>${esc(itemTitle(wid))}</b> baixado e ativado.`, "ok");
    } else if (ms.length > 1) toast(`<b>${esc(itemTitle(wid))}</b> baixado. Ele tem ${ms.length} mods: escolha na aba Mods.`, "info", 6000);
  }
  store.set("pending", [...pendingActivate]);
  // avança a fila
  if (Q) {
    let moved = false;
    while (Q.i < Q.ids.length && isSubscribed(Q.ids[Q.i])) { Q.i++; moved = true; }
    if (Q.i >= Q.ids.length) finishQueue();
    else if (moved) { store.set("queue", Q); openWorkshop(Q.ids[Q.i]); }
  }
  if (!waitingIds().length && pendingSince) { pendingSince = 0; store.set("pendingSince", 0); }
  renderQueue();
  if (setupMode) runSetup();
}

    `Quer ver os addons recomendados?`, "Ver recomendados", "Fechar").then(ok => ok && setView("rec"));

/* ---------- ações ---------- */
async function doFix(fix) {
  switch (fix.type) {
    case "activate": return setActive(fix.id, true);
    case "deactivate": return setActive(fix.id, false);
    case "remove": P.active = P.active.filter(x => x !== fix.id); scheduleSave(); render(); return;
    case "subscribe": return startQueue(fix.ids, true);
    case "search": return call("open", {url: "https://steamcommunity.com/workshop/browse/?appid=108600&searchtext=" + encodeURIComponent(fix.q)});
    case "downloads": return call("open", {url: "steam://open/downloads"});
    case "zb": return setView("dash");
    case "zbInstall": return zbAction("install");
    case "sort": P.active = computeOrder(P.active); scheduleSave(); render(); return;
    case "memory": return setMemory(fix.mb);
    case "map": return setView("map");
  }
}
async function fixAll() {
  let n = 0; const subs = [];
  // ZombieBuddy primeiro (recarrega o estado)
  if (analyze().issues.some(i => i.fix?.type === "zbInstall")) {
    if (S.env.gameRunning) toast("Feche o jogo para instalar o ZombieBuddy.", "warn");
    else {
      clearTimeout(saveTimer); if (dirty) await saveProfile();
      zbBusy = true; render();
      try { await call("zbInstall"); n++; await loadState(); } catch (e) { toast(esc(e.message), "err", 7000); }
      finally { zbBusy = false; }
    }
  }
  const A = analyze();
  for (const i of A.issues) {
    if (!i.fix) continue;
    if (i.fix.type === "activate" && !P.active.includes(i.fix.id)) { await setActive(i.fix.id, true, true); n++; }
    else if (i.fix.type === "remove") { P.active = P.active.filter(x => x !== i.fix.id); n++; }
    else if (i.fix.type === "subscribe") subs.push(...i.fix.ids);
  }
  P.active = computeOrder(P.active); scheduleSave();
  if (subs.length) startQueue(subs, true);
  toast(n || subs.length ? `Corrigido: ${n} item(ns)${subs.length ? `; ${subs.length} para inscrever` : ""}. Incompatibilidades ficam para você decidir.` : "Nada para corrigir automaticamente.", n || subs.length ? "ok" : "info");
  render();
}

                : `<button class="btn sm" data-a="actItem" data-v="${r.id}">Ativar</button>`;
  return `<div class="rc">
    <div class="img" style="background-image:url('${esc(cssUrl(r.preview ? r.preview + (r.preview.includes("?") ? "&" : "?") + "imw=512" : ""))}')"><div class="tl">
      ${inst ? `<span class="badge ok">Inscrito</span>` : ""}${obsolete ? `<span class="badge warn">Obsoleto</span>` : ""}</div></div>
    <div class="bd"><b>${esc(r.title)}</b>
      <div class="meta">${fmtN(r.subscriptions)} ${L("inscritos", "subscribers")} · ${L("atualizado", "updated")} ${ago(r.timeUpdated)}${cat && !note ? " · " + cat : ""}</div>
      ${note ? `<div class="nt">${esc(note)}</div>` : r.shortDesc ? `<div class="nt" style="color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(r.shortDesc)}</div>` : ""}
    </div>
    <div class="ft">${btn}<span class="sp"></span><a style="font-size:12px" data-a="ws" data-v="${r.id}">Workshop ↗</a></div>
  </div>`;
}
// itens removidos/ocultos no Workshop saem das recomendações (a menos que já estejam instalados)
const recById = () => new Map((REC?.items || []).filter(r => !r.removed || I.items.has(r.id)).map(r => [r.id, r]));
function viewRec() {
  if (!REC) return `<div class="empty"><span class="spin"></span><br><br>Buscando addons do Viewpoint no Workshop…</div>`;
  const byId = recById();
  const core = REC.curated.filter(c => c.group === "core" && byId.has(c.id));
  const ess = REC.curated.filter(c => c.group === "essential" && byId.has(c.id));
  const curatedIds = new Set(REC.curated.map(c => c.id));
  let pop = REC.addons.map(id => byId.get(id)).filter(r => r && !curatedIds.has(r.id) && !(r.tags || []).includes("Modding or Configuration"));
  pop.sort((a, b) => (/not needed/i.test(a.title) - /not needed/i.test(b.title)) || (b.subscriptions - a.subscriptions));
  const counts = Object.fromEntries(REC_CATS.map(([k]) => [k, k === "all" ? pop.length : pop.filter(r => recCategory(r) === k).length]));
  if (recCat !== "all") pop = pop.filter(r => recCategory(r) === recCat);
  const essMissing = ess.filter(c => !I.items.has(c.id) && !isSubscribed(c.id) && !pendingActivate.has(c.id)).map(c => c.id);
  const coreMissing = core.filter(c => !I.items.has(c.id) && !isSubscribed(c.id)).map(c => c.id);
  return `
  <div class="sec"><h3>Base</h3><span>Obrigatórios para o Viewpoint funcionar</span><span class="sp"></span>
    ${coreMissing.length ? `<button class="btn primary sm" data-a="setup">Configurar tudo</button>` : ""}</div>
  <div class="rgrid">${core.map(c => recCard(byId.get(c.id), c.note)).join("")}</div>
  <div class="sec"><h3>Essenciais</h3><span>Correções e modelos 3D que quase todo mundo usa</span><span class="sp"></span>
    ${essMissing.length ? `<button class="btn primary sm" data-a="subMany" data-v="${essMissing.join(",")}">Inscrever e ativar os ${essMissing.length} que faltam</button>` : `<span class="badge ok">Todos inscritos</span>`}</div>
  <div class="rgrid">${ess.map(c => recCard(byId.get(c.id), c.note)).join("")}</div>
  <div class="sec"><h3>Populares da comunidade</h3><span>Addons que dependem do Viewpoint, por número de inscritos</span><span class="sp"></span>
    <button class="btn ghost sm" data-a="recRefresh">${recLoading ? '<span class="spin"></span>' : "⟳ Atualizar"}</button></div>
  <div class="chips" style="margin-bottom:14px">${REC_CATS.map(([k, l]) => `<button class="chip ${recCat === k ? "on" : ""}" data-a="recCat" data-v="${k}">${l}<span class="n">${counts[k]}</span></button>`).join("")}</div>
  <div class="rgrid">${pop.map(r => recCard(r)).join("")}</div>
  <div class="note" style="margin-top:18px">A lista "Populares" vem ao vivo do Workshop. Itens marcados como <b>Obsoleto</b> dizem no título que não são mais necessários nas versões novas do Viewpoint.
  Os addons são da comunidade: confira a página de cada um antes de usar em servidor.</div>`;
}

const CF_SEV = {err: ["err", "Incompatível"], warn: ["warn", "Atenção"], info: ["info", "Só visual"], ok: ["ok", "Esperado"]};
const plural = (n, um, varios) => n === 1 ? um : varios;
const exs = (l, n = 2) => l.slice(0, n).map(x => `"${x}"`).join(", ") + (l.length > n ? "…" : "");
/** Explica em linguagem simples o que o cruzamento de dois mods causa. p.b carrega depois e vence. */
function cfInfo(p) {
  const A = modName(p.a), B = modName(p.b);
  const g = {incompat: [], lua: [], txt: [], item: [], vehicle: [], recipe: [], model: [], other: [], map: []};
  for (const x of p.points) {
    if (x.kind === "incompat") g.incompat.push(x.name);
    else if (x.kind === "map") g.map.push(x.name);
    else if (x.kind === "file") (x.name.toLowerCase().endsWith(".lua") ? g.lua : g.txt).push(x.name.split("/").pop());
    else {
      const m = x.name.match(/^(template \S+|\S+) (.*)$/), t = m[1].toLowerCase(), n = m[2];
      if (t === "item") g.item.push(n);
      else if (t.includes("vehicle")) g.vehicle.push(n);
      else if (["recipe", "craftrecipe", "evolvedrecipe", "fixing"].includes(t)) g.recipe.push(n);
      else if (t === "model" || t === "sound") g.model.push(n);
      else g.other.push(n);
    }
  }
  const ma = primary(p.a), mb = primary(p.b);
  const dep = depsOf(p.b).ids.includes(p.a) ? [B, A] : depsOf(p.a).ids.includes(p.b) ? [A, B] : null;
  const patch = /patch|compat|fix/i.test(B) ? B : /patch|compat|fix/i.test(A) ? A : null;
  const ordered = mb?.loadAfter.includes(p.a) || ma?.loadBefore.includes(p.b);
  const fx = [];
  if (g.incompat.length) fx.push(`O autor diz que estes mods não funcionam juntos: pode dar erro, travar ou corromper o save.`);
  if (g.lua.length) fx.push(`${plural(g.lua.length, "Um arquivo de código", g.lua.length + " arquivos de código")} de ${A} ${plural(g.lua.length, "é trocado", "são trocados")} pelo de ${B} (${exs(g.lua)}). Parte do que ${A} faz pode parar de funcionar.`);
  if (g.item.length) fx.push(`${plural(g.item.length, "Um item existe", g.item.length + " itens existem")} nos dois (${exs(g.item)}): fica a versão de ${B} (peso, dano, aparência, receitas).`);
  if (g.vehicle.length) fx.push(`${plural(g.vehicle.length, "Um veículo existe", g.vehicle.length + " veículos existem")} nos dois (${exs(g.vehicle)}): fica a versão de ${B}.`);
  if (g.recipe.length) fx.push(`${plural(g.recipe.length, "Uma receita/conserto existe", g.recipe.length + " receitas/consertos existem")} nos dois (${exs(g.recipe)}): só a de ${B} vale.`);
  if (g.model.length) fx.push(`${plural(g.model.length, "Um modelo 3D/som existe", g.model.length + " modelos 3D/sons existem")} nos dois: a aparência de ${B} substitui a de ${A}. Normalmente não quebra nada.`);
  if (g.other.length) fx.push(`${g.other.length} definição(ões) de script em comum (${exs(g.other)}): vale a de ${B}.`);
  // arquivo de script repetido só importa se não soubermos quais objetos ele define
  if (g.txt.length && !(g.item.length + g.vehicle.length + g.recipe.length + g.model.length + g.other.length))
    fx.push(`${plural(g.txt.length, "Um arquivo de script", g.txt.length + " arquivos de script")} de ${A} ${plural(g.txt.length, "é trocado", "são trocados")} pelo de ${B} (${exs(g.txt)}).`);
  if (g.map.length) fx.push(`Os dois mapas ocupam ${plural(g.map.length, "a mesma célula", g.map.length + " células iguais")} do mundo: ali a construção de ${B} cobre a de ${A} (prédios cortados ou sobrepostos).`);
  const why = dep ? `${dep[0]} depende de ${dep[1]}: a sobreposição é proposital.`
    : patch ? `${patch} parece ser um patch/correção do outro: a sobreposição é proposital.`
    : ordered ? `Os autores já definiram esta ordem de carregamento: a sobreposição é proposital.` : null;
  const sev = g.incompat.length ? "err" : why ? "ok"
    : g.lua.length + g.item.length + g.vehicle.length + g.recipe.length + g.map.length + g.other.length || (g.txt.length && !g.model.length) ? "warn" : "info";
  return {sev, fx, why, g};
}

function cfCard(p) {
  const k = cfStable(p), info = cfInfo(p), [cls, label] = CF_SEV[info.sev], ign = cfIgnored.has(k), open = cfOpen.has(k);
  const A = esc(modName(p.a)), B = esc(modName(p.b)), num = id => P.active.indexOf(id) + 1;
  const pts = p.points.filter(x => x.kind !== "incompat");
  return `<div class="cfc ${cls}" id="cf-${esc(k)}">
    <div class="ch"><span class="badge ${cls}">${label}</span><b>${A}<span>×</span>${B}</b>
      <button class="btn ghost sm" data-a="cfIgnore" data-v="${esc(k)}" title="${ign ? "Voltar a mostrar em Precisam de atenção" : "Já sei, não mostrar mais como alerta"}">${ign ? "Voltar a mostrar" : "Ignorar"}</button></div>
    <div class="cb">
      ${info.why ? `<div class="win">✓ ${esc(info.why)}</div>` : ""}
      <ul>${info.fx.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      ${info.sev !== "err" && pts.length ? `<div class="win">Vence: <b>${B}</b> (#${num(p.b)}, carrega por último).</div>` : ""}
      <div class="row">
        ${info.sev !== "err" && pts.length && !info.why ? `<button class="btn sm" data-a="cfWin" data-v="${esc(p.a)}" data-o="${esc(p.b)}" title="Carregar ${A} depois de ${B}">Fazer ${A} vencer</button>` : ""}
        <button class="btn sm" data-a="cfOff" data-v="${esc(p.a)}">Desativar ${A}</button>
        <button class="btn sm" data-a="cfOff" data-v="${esc(p.b)}">Desativar ${B}</button>
        <span style="flex:1"></span>
        ${pts.length ? `<button class="btn ghost sm" data-a="cfDet" data-v="${esc(k)}">${open ? "Ocultar detalhes ▴" : `Ver os ${pts.length} ponto(s) ▾`}</button>` : ""}
      </div>
      ${open && pts.length ? `<div class="pts">${pts.slice(0, 400).map(x => esc(x.kind === "map" ? "célula " + x.name : x.name)).join("<br>")}${pts.length > 400 ? `<br>… e mais ${pts.length - 400}` : ""}</div>` : ""}
    </div></div>`;
}

function cfMatrix(pairs) {
  const involved = P.active.filter(id => [...pairs.values()].some(p => p.a === id || p.b === id));
  const num = id => P.active.indexOf(id) + 1;
  let cells = `<div class="corner"></div>` + involved.map(id => `<div class="hd" title="${esc(modName(id))}">${num(id)}</div>`).join("");
  for (const r of involved) {
    cells += `<div class="lb" title="${esc(modName(r))}">#${num(r)} ${esc(modName(r))}</div>`;
    for (const c of involved) {
      if (r === c) { cells += `<div class="c d"></div>`; continue; }
      const k = num(r) < num(c) ? r + "|" + c : c + "|" + r, p = pairs.get(k);
      if (!p) { cells += `<div class="c"></div>`; continue; }
      const sev = cfInfo(p).sev, ign = cfIgnored.has(cfStable(p));
      const bg = {err: "var(--err)", warn: "var(--warn)", info: "var(--info)", ok: "var(--ok)"}[sev];
      cells += `<div class="c hit" style="background:${bg};opacity:${ign ? .3 : 1}" data-a="cfCell" data-v="${esc(k)}"
        title="${esc(modName(p.a))} × ${esc(modName(p.b))}: ${CF_SEV[sev][1]}${ign ? " (ignorado)" : ""}. Clique para ver.">${p.points.length > 99 ? "99+" : p.points.length}</div>`;
    }
  }
  return `<div class="mxwrap" style="margin-bottom:16px"><div class="mx" style="grid-template-columns:minmax(160px,240px) repeat(${involved.length},22px)">${cells}</div></div>`;
}

function viewMap() {
  if (!P.active.length) return `<div class="empty"><b>Nenhum mod ativo</b>Ative mods em <b>${esc(profLabel())}</b> para ver onde eles se cruzam.</div>`;
  loadConflicts();
  const pairs = conflictPairs();
  const all = [...pairs.values()].map(p => ({p, k: cfStable(p), sev: cfInfo(p).sev}));
  const order = {err: 0, warn: 1, info: 2, ok: 3};
  all.sort((x, y) => order[x.sev] - order[y.sev] || y.p.points.length - x.p.points.length);
  const groups = {
    att: all.filter(x => !cfIgnored.has(x.k) && x.sev !== "ok"),
    ok: all.filter(x => !cfIgnored.has(x.k) && x.sev === "ok"),
    ign: all.filter(x => cfIgnored.has(x.k)),
  };
  const serious = groups.att.filter(x => x.sev === "err" || x.sev === "warn").length;
  const scanning = cfLoading ? `<span class="badge"><span class="spin" style="width:10px;height:10px"></span> verificando scripts e mapas…</span>` : "";
  const sum = !all.length
    ? `<div class="cfsum ok"><span class="dot ok"></span><div style="flex:1"><b>${cfLoading ? "Verificando…" : "Nenhum conflito"}</b><div class="sub" style="margin:0">Os ${P.active.length} mods ativos não mexem nas mesmas coisas.</div></div>${scanning}</div>`
    : `<div class="cfsum ${serious ? "" : "ok"}"><span class="dot ${groups.att.some(x => x.sev === "err") ? "err" : serious ? "warn" : "ok"}"></span><div style="flex:1">
        <b>${serious ? `${serious} ${plural(serious, "conflito precisa", "conflitos precisam")} da sua atenção` : "Nada sério"}</b>
        <div class="sub" style="margin:0">Quando dois mods mexem na mesma coisa, vale o que carrega por último. Em cada caso você pode escolher quem vence, desativar um deles ou ignorar o alerta.</div></div>
        ${scanning}<button class="btn sm" data-a="cfMap">${cfMap ? "Esconder mapa" : "Mapa visual"}</button></div>`;
  if (!all.length) return sum;
  if (!groups[cfTab].length) cfTab = groups.att.length ? "att" : groups.ok.length ? "ok" : "ign";
  const tabs = `<div class="chips" style="margin-bottom:12px">${[["att", "Precisam de atenção"], ["ok", "Esperados"], ["ign", "Ignorados"]].map(([k, l]) =>
    `<button class="chip ${cfTab === k ? "on" : ""}" data-a="cfTab" data-v="${k}">${l}<span class="n">${groups[k].length}</span></button>`).join("")}</div>`;
  const list = groups[cfTab].length ? `<div class="list" style="gap:10px">${groups[cfTab].map(x => cfCard(x.p)).join("")}</div>`
    : `<div class="empty"><b>Nada aqui</b></div>`;
  return sum + (cfMap ? cfMatrix(pairs) : "") + tabs + list;
}

function viewSrv() {
  const servers = S.profiles.filter(p => p.type === "server");
  return `
  <div class="grid g2">
    <div class="card">
      <h2>Entrar no servidor de outra pessoa</h2>
      <div class="sub">O jogo baixa sozinho os mods do servidor ao conectar.</div>
      <div class="checks">
        <div class="chk"><span class="dot ${S.zb.state === "ok" ? "ok" : "warn"}"></span>${S.zb.state === "ok" ? "ZombieBuddy instalado: pronto para servidores com Viewpoint" : "Se o servidor usa Viewpoint, instale o ZombieBuddy no Painel antes"}</div>
        <div class="chk"><span class="dot ${S.env.steamRunning ? "ok" : "warn"}"></span>Steam ${S.env.steamRunning ? "aberta" : "fechada (precisa estar aberta para baixar os mods)"}</div>
      </div>
      <div class="note">Na primeira conexão, o ZombieBuddy pode pedir aprovação para carregar o Java do Viewpoint. Clique em <b>Sim</b>.</div>
    </div>
    <div class="card">
      <h2>Hospedar o seu servidor</h2>
      <div class="sub">Configurações criadas em <b>Hospedar</b> no menu do jogo aparecem aqui.</div>
      <div class="note" style="margin-top:0">Ao editar um servidor, o app atualiza juntos <b>Mods=</b>, <b>WorkshopItems=</b> e os mapas de mods em <b>Map=</b>, com dependências e ordem. Uma cópia de segurança vai para a pasta <code>dados\\backups</code>.</div>
    </div>
  </div>
  <div class="sec"><h3>Seus servidores</h3><span>${servers.length} configuração(ões)</span></div>
  ${servers.length ? `<div class="list">${servers.map(s => `<div class="mod"><div class="srv">
      <div class="ic">${ICONS.srv}</div>
      <div class="nm"><b>${esc(s.label)}</b><span>${esc(s.file)}</span></div>
      ${s.key === P.key ? `<span class="badge ok">perfil atual</span>` : ""}
      <button class="btn sm" data-a="folder" data-v="${esc(s.file)}">Arquivo</button>
      <button class="btn primary sm" data-a="editSrv" data-v="${esc(s.key)}">Editar mods</button>
    </div></div>`).join("")}</div>`
    : `<div class="empty"><b>Nenhum servidor ainda</b>No jogo, vá em <b>Hospedar → Gerenciar configurações</b> e crie um. Ele aparece aqui na hora.</div>`}`;
}

/* ---------- início ---------- */
(async () => {
  try {
    await loadState();
    call("setLang", {lang: LANG}).catch(() => {});
    render();
    memIntro();
    if (Q) renderQueue();
    loadRec();
    await fetchRemote(false);
    await afterChange();
    // aviso: ZombieBuddy desconfigurado por atualização do jogo
    if (S.zb.state === "needs_repair")
      toast("A configuração do ZombieBuddy sumiu (provavelmente uma atualização do jogo). Clique em <b>Reparar</b> no Painel.", "warn", 9000);
    setInterval(() => fetchRemote(false), 30 * 60 * 1000);
  } catch (e) {
    $("#content").innerHTML = `<div class="empty"><b>Erro ao iniciar</b>${esc(e.message)}</div>`;
  }
})();
</script>
