# Compila a Release no GitHub a partir do código público e publica o zip + SHA-256.
# Dispara ao enviar uma tag v* (ex.: git tag v1.1.0 && git push origin v1.1.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release a (re)publicar (ex.: v1.1.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Conferir versão do csproj com a tag
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/PZModManager.csproj
          $v = $proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG diferente da versão do csproj (v$v)" }

      - name: Compilar (release.ps1)
        shell: pwsh
        run: ./release.ps1

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/PZModManager-win-x64.zip

      - name: Publicar na Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "release/PZModManager-win-x64.zip", "release/PZModManager-win-x64.zip.sha256"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "PZ Mod Manager $env:TAG" --notes-file .github/release-notes.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a Release" }
